---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: playertransfers.gateway.networking.minefleet.dev
spec:
  group: gateway.networking.minefleet.dev
  names:
    kind: PlayerTransfer
    listKind: PlayerTransferList
    plural: playertransfers
    singular: playertransfer
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PlayerTransfer is the Schema for the playertransfers API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              spec defines the desired state of PlayerTransfer. It is immutable: create a
              new PlayerTransfer instead of retargeting one in flight.
            properties:
              gatewayName:
                description: gatewayName is the name of the Gateway whose proxies
                  hold the players.
                type: string
              listenerName:
                description: listenerName is the Gateway listener (section name) the
                  players are connected to.
                type: string
              players:
                description: players lists the player UUIDs to transfer.
                items:
                  description: PlayerUUID is the Minecraft player UUID in canonical
                    dashed form.
                  pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                  type: string
                minItems: 1
                type: array
              policy:
                default: AllOrNothing
                description: policy controls whether the transfer waits for all players
                  to be present.
                enum:
                - AllOrNothing
                - BestEffort
                type: string
              target:
                description: target selects where the players are moved to.
                properties:
                  labelSelector:
                    description: |-
                      labelSelector picks a single server matching the selector, using the
                      backend's distribution strategy. All players are moved to that one server.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  routeMode:
                    description: |-
                      routeMode evaluates the gateway's join or fallback routes individually per
                      player, so players may land on different servers.
                    enum:
                    - join
                    - fallback
                    type: string
                  serverName:
                    description: |-
                      serverName names an already registered server (pod name) explicitly. The
                      controller does not resolve connection details for this mode.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of routeMode, labelSelector or serverName must
                    be set
                  rule: '[has(self.routeMode), has(self.labelSelector), has(self.serverName)].filter(x,
                    x).size() == 1'
              ttl:
                description: |-
                  ttl bounds how long the transfer waits for players to become present.
                  Omit to wait indefinitely.
                type: string
            required:
            - gatewayName
            - listenerName
            - players
            - target
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: status defines the observed state of PlayerTransfer
            properties:
              assignments:
                description: assignments holds the per-player outcome.
                items:
                  description: PlayerTransferAssignment records the outcome for a
                    single player.
                  properties:
                    assignedServer:
                      description: assignedServer is the server the player was moved
                        to, once resolved.
                      type: string
                    phase:
                      description: phase is the state of this player's move.
                      enum:
                      - Pending
                      - Moving
                      - Completed
                      - Failed
                      type: string
                    playerUUID:
                      description: playerUUID is the player this assignment belongs
                        to.
                      pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                      type: string
                    reason:
                      description: reason explains a failed assignment.
                      type: string
                  required:
                  - phase
                  - playerUUID
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - playerUUID
                x-kubernetes-list-type: map
              phase:
                description: phase is the aggregate state of the transfer.
                enum:
                - Pending
                - Completed
                - PartiallyCompleted
                - Failed
                - Expired
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
