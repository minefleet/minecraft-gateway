apiVersion: gateway.networking.minefleet.dev/v1alpha1
kind: NetworkInfrastructure
metadata:
  labels:
    app.kubernetes.io/name: minecraft-gateway
    app.kubernetes.io/managed-by: kustomize
  name: infrastructure-sample
spec:
  discovery:
    labelSelector:
      matchLabels:
        minefleet.dev/environment: sample
    namespaceSelector:
      from: Same
  networkTemplate:
    template:
      spec:
        containers:
          - name: network
            volumeMounts:
              - mountPath: "/velocity/forwarding.secret"
                subPath: forwarding.secret
                name: forwarding-secret
                readOnly: true
              # Files placed in /config are staged into Velocity's working
              # directory at startup. Velocity rewrites velocity.toml when it
              # migrates config between versions, and it cannot do that on a
              # ConfigMap mount, which is always read-only.
              - mountPath: "/config"
                name: network-config
                readOnly: true

        volumes:
          - name: forwarding-secret
            secret:
              secretName: network-forwarding-secret
              items:
                - key: MF_FORWARDING_SECRET
                  path: forwarding.secret
          - name: network-config
            configMap:
              name: network-config