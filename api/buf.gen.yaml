version: v2
plugins:
  # Plugin versions are pinned so regeneration is reproducible. The java gencode
  # version must stay <= the protobuf runtime pinned in
  # integrations/gradle/libs.versions.toml.
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: ./
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: ./
    opt: paths=source_relative
  - remote: buf.build/protocolbuffers/java:v36.1
    out: ../integrations/api/src/main/java
  - remote: buf.build/grpc/java:v1.76.0
    out: ../integrations/api/src/main/java